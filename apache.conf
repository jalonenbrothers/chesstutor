<VirtualHost *:80>
    # The whole project is mounted at /var/www/html, mirroring a shared-hosting
    # deployment where the repository sits in the web root (public_html).
    # The root .htaccess routes every request into public/ and blocks
    # everything else (src/, config/, docs/, .git/...).
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
